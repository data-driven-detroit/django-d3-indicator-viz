[project]
name = "django-d3-indicator-viz"
version = "0.1.10"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Django 6.1 raised the PostgreSQL floor to 15; capped so consumers on PG 14 resolve to 6.0.x
    "django>=5.2.8,<6.1",
    "django-admin-sortable>=2.3",
    "django-admin-sortable2>=2.3",
    "django-filter>=25.2",
    "django-import-export>=4.3.14",
    "django-rest-framework>=0.1.0",
    "factory-boy>=3.3.3",
    "faker>=38.2.0",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
]

[tool.setuptools.packages.find]
include = ["django_d3_indicator_viz*"]
