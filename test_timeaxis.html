<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: getTimeAxisConfig</title>
    <style>
        body {
            font-family: monospace;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 { color: #fff; }
        .test-case {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-case h3 {
            margin-top: 0;
            color: #7cb3f0;
        }
        .input {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            font-size: 12px;
        }
        .output {
            background: #1a3a1a;
            border: 1px solid #3a5a3a;
            padding: 10px;
            border-radius: 4px;
        }
        .output-row {
            margin: 5px 0;
        }
        .label { color: #aaa; }
        .value { color: #7cf07c; font-weight: bold; }
        .formatted-examples {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }
        .formatted-examples span {
            display: inline-block;
            background: #444;
            padding: 2px 8px;
            margin: 2px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>getTimeAxisConfig Test Harness</h1>
    <div id="results"></div>

    <script type="module">
        import { getTimeAxisConfig } from './django_d3_indicator_viz/static/utils.js';

        const resultsDiv = document.getElementById('results');

        // Test cases
        const testCases = [
            {
                name: "Yearly data (2020-2024)",
                data: [
                    [new Date(2020, 0, 1), new Date(2021, 0, 1), new Date(2022, 0, 1)],
                    [new Date(2020, 0, 1), new Date(2022, 0, 1), new Date(2024, 0, 1)]
                ]
            },
            {
                name: "Monthly data (Jan-Jun 2023)",
                data: [
                    [new Date(2023, 0, 1), new Date(2023, 1, 1), new Date(2023, 2, 1)],
                    [new Date(2023, 3, 1), new Date(2023, 4, 1), new Date(2023, 5, 1)]
                ]
            },
            {
                name: "Daily data (first week of Jan 2023)",
                data: [
                    [new Date(2023, 0, 1), new Date(2023, 0, 2), new Date(2023, 0, 3)],
                    [new Date(2023, 0, 4), new Date(2023, 0, 5), new Date(2023, 0, 6), new Date(2023, 0, 7)]
                ]
            },
            {
                name: "Hourly data (morning of Jan 1, 2023)",
                data: [
                    [new Date(2023, 0, 1, 8, 0), new Date(2023, 0, 1, 9, 0), new Date(2023, 0, 1, 10, 0)],
                    [new Date(2023, 0, 1, 11, 0), new Date(2023, 0, 1, 12, 0)]
                ]
            },
            {
                name: "Minute data (9:00-9:10 AM)",
                data: [
                    [new Date(2023, 0, 1, 9, 0), new Date(2023, 0, 1, 9, 2), new Date(2023, 0, 1, 9, 4)],
                    [new Date(2023, 0, 1, 9, 6), new Date(2023, 0, 1, 9, 8), new Date(2023, 0, 1, 9, 10)]
                ]
            },
            {
                name: "Single data point (should default to yearly)",
                data: [
                    [new Date(2023, 0, 1)]
                ]
            },
            {
                name: "Mixed series with gaps (2020, 2021, 2023 - missing 2022)",
                data: [
                    [new Date(2020, 0, 1), new Date(2021, 0, 1), new Date(2023, 0, 1)],
                    [new Date(2020, 0, 1), new Date(2023, 0, 1)]
                ]
            },
            {
                name: "Timestamps as milliseconds",
                data: [
                    [Date.UTC(2022, 0, 1), Date.UTC(2022, 6, 1), Date.UTC(2023, 0, 1)],
                    [Date.UTC(2022, 3, 1), Date.UTC(2022, 9, 1)]
                ]
            }
        ];

        function formatTimestampList(timestamps) {
            return timestamps.map(t => {
                const d = t instanceof Date ? t : new Date(t);
                return d.toISOString().split('T')[0] +
                    (d.getHours() || d.getMinutes() ? ` ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}` : '');
            }).join(', ');
        }

        testCases.forEach((testCase, index) => {
            const result = getTimeAxisConfig(testCase.data);

            // Get sample formatted values from the actual data
            const allTimestamps = testCase.data.flat();
            const formattedExamples = allTimestamps.slice(0, 5).map(t => {
                const ms = t instanceof Date ? t.getTime() : t;
                return result.formatter(ms);
            });

            const html = `
                <div class="test-case">
                    <h3>Test ${index + 1}: ${testCase.name}</h3>
                    <div class="input">
                        <div class="label">Input timestamps:</div>
                        ${testCase.data.map((series, i) =>
                            `Series ${i + 1}: [${formatTimestampList(series)}]`
                        ).join('<br>')}
                    </div>
                    <div class="output">
                        <div class="output-row">
                            <span class="label">unit:</span>
                            <span class="value">${result.unit}</span>
                        </div>
                        <div class="output-row">
                            <span class="label">minInterval:</span>
                            <span class="value">${result.minInterval.toLocaleString()} ms</span>
                            <span class="label">(${(result.minInterval / (1000 * 60 * 60 * 24)).toFixed(1)} days)</span>
                        </div>
                        <div class="formatted-examples">
                            <span class="label">Formatted labels:</span>
                            ${formattedExamples.map(f => `<span>${f}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;

            resultsDiv.innerHTML += html;
        });
    </script>
</body>
</html>
