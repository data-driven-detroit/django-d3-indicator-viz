{% load static %}
<div class="ddiv-indicator-search-wrapper">
  <input type="text" class="ddiv-indicator-search-input" placeholder="Search indicators..." autocomplete="off">
  <div class="ddiv-indicator-search-dropdown"></div>
</div>

<style>
.ddiv-indicator-search-wrapper {
  position: relative;
  width: 100%;
  max-width: 400px;
}
.ddiv-indicator-search-input {
  width: 100%;
  padding: 8px 12px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}
.ddiv-indicator-search-input:focus {
  outline: none;
  border-color: #4a90d9;
  box-shadow: 0 0 0 2px rgba(74, 144, 217, 0.2);
}
.ddiv-indicator-search-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid #ccc;
  border-top: none;
  border-radius: 0 0 4px 4px;
  max-height: 300px;
  overflow-y: auto;
  z-index: 1000;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}
.ddiv-indicator-search-item {
  padding: 8px 12px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
}
.ddiv-indicator-search-item:last-child {
  border-bottom: none;
}
.ddiv-indicator-search-item:hover,
.ddiv-indicator-search-item.ddiv-indicator-search-active {
  background: #f0f4f8;
}
.ddiv-indicator-search-item-name {
  font-size: 14px;
  color: #333;
}
.ddiv-indicator-search-no-results {
  padding: 8px 12px;
  color: #888;
  font-size: 14px;
}
@keyframes ddiv-indicator-search-highlight {
  0% { background-color: rgba(74, 144, 217, 0.3); }
  100% { background-color: transparent; }
}
.ddiv-indicator-search-highlight {
  animation: ddiv-indicator-search-highlight 1.5s ease-out;
}
</style>

<script>
(function() {
  var wrapper = document.querySelector('.ddiv-indicator-search-wrapper');
  var input = wrapper.querySelector('.ddiv-indicator-search-input');
  var dropdown = wrapper.querySelector('.ddiv-indicator-search-dropdown');
  var searchUrl = "{% url 'indicator_search' %}";
  var profileUrlTemplate = "{% url 'profile' location_id='__LOC__' %}";
  var defaultLocationId = "{{ default_location_id }}";
  var debounceTimer = null;
  var activeIndex = -1;

  function getItems() {
    return dropdown.querySelectorAll('.ddiv-indicator-search-item');
  }

  function setActive(index) {
    var items = getItems();
    if (items.length === 0) return;
    items.forEach(function(el) { el.classList.remove('ddiv-indicator-search-active'); });
    if (index < 0) index = items.length - 1;
    if (index >= items.length) index = 0;
    activeIndex = index;
    items[activeIndex].classList.add('ddiv-indicator-search-active');
    items[activeIndex].scrollIntoView({ block: 'nearest' });
  }

  function showDropdown() {
    dropdown.style.display = 'block';
  }

  function hideDropdown() {
    dropdown.style.display = 'none';
    activeIndex = -1;
  }

  function selectIndicator(indicatorId) {
    var el = document.querySelector('[data-indicator-id="' + indicatorId + '"]');
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('ddiv-indicator-search-highlight');
      el.addEventListener('animationend', function() {
        el.classList.remove('ddiv-indicator-search-highlight');
      }, { once: true });
      hideDropdown();
      input.value = '';
    } else {
      var url = profileUrlTemplate.replace('__LOC__', defaultLocationId);
      window.location.href = url + '#indicator-' + indicatorId;
    }
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function doSearch(query) {
    if (query.length < 2) {
      hideDropdown();
      return;
    }
    fetch(searchUrl + '?q=' + encodeURIComponent(query))
      .then(function(resp) { return resp.json(); })
      .then(function(data) {
        dropdown.innerHTML = '';
        activeIndex = -1;
        if (data.results.length === 0) {
          dropdown.innerHTML = '<div class="ddiv-indicator-search-no-results">No results found</div>';
          showDropdown();
          return;
        }
        data.results.forEach(function(ind) {
          var div = document.createElement('div');
          div.className = 'ddiv-indicator-search-item';
          div.setAttribute('data-id', ind.id);
          div.innerHTML = '<span class="ddiv-indicator-search-item-name">' + escapeHtml(ind.name) + '</span>';
          div.addEventListener('click', function() {
            selectIndicator(ind.id);
          });
          dropdown.appendChild(div);
        });
        showDropdown();
      });
  }

  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    var query = input.value.trim();
    debounceTimer = setTimeout(function() {
      doSearch(query);
    }, 250);
  });

  input.addEventListener('keydown', function(e) {
    var items = getItems();
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (dropdown.style.display === 'none') return;
      setActive(activeIndex + 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (dropdown.style.display === 'none') return;
      setActive(activeIndex - 1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && activeIndex < items.length) {
        selectIndicator(items[activeIndex].getAttribute('data-id'));
      }
    } else if (e.key === 'Escape') {
      hideDropdown();
    }
  });

  document.addEventListener('click', function(e) {
    if (!wrapper.contains(e.target)) {
      hideDropdown();
    }
  });
})();
</script>
